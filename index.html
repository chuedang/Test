<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1d2330;--mu:#667085;--bd:#dde1ea;--pr:#7a1f2b;--ok:#157347;--okb:#e3f5ea;--no:#b42318;--nob:#fdeceb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--tx:#e8ebf2;--mu:#98a2b3;--bd:#2d3447;--pr:#e8a0aa;--ok:#5fd394;--okb:#12301f;--no:#ff8a80;--nob:#3a1816}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--tx:#e8ebf2;--mu:#98a2b3;--bd:#2d3447;--pr:#e8a0aa;--ok:#5fd394;--okb:#12301f;--no:#ff8a80;--nob:#3a1816}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:8px 0 2px;color:var(--pr)}
.sub{color:var(--mu);font-size:.9rem;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--pr);width:0;transition:width .3s}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem}
.q{font-size:1.1rem;font-weight:600;margin:6px 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--bd);border-radius:10px;padding:11px 12px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pr)}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-size:.85rem}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.ok b{background:var(--ok);color:#fff}
.opt.no{background:var(--nob);border-color:var(--no)}.opt.no b{background:var(--no);color:#fff}
.opt:disabled{cursor:default}
.exp{margin-top:12px;padding:12px;border-radius:10px;background:var(--bg);border-left:4px solid var(--pr);font-size:.95rem}
.exp.g{border-color:var(--ok)}.exp.r{border-color:var(--no)}
.btn{font:inherit;font-weight:600;background:var(--pr);color:#fff;border:0;border-radius:10px;padding:11px 22px;cursor:pointer;margin-top:14px}
:root:not([data-theme="light"]) .btn{color:#12151c}
.btn.sec{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}
.score{font-size:3rem;font-weight:700;color:var(--pr);text-align:center;margin:6px 0}
.rev{border-top:1px solid var(--bd);padding:10px 0;font-size:.95rem}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

    <div id="opts"></div>
    <div id="exp" class="exp hide"></div>

  <div id="res" class="card hide"></div>
</div>

["สำนักงานตำรวจแห่งชาติเป็นส่วนราชการระดับกรมแต่ไม่สังกัดกระทรวงใด ข้อใดบอกสายการบังคับบัญชาได้ถูกต้อง","อยู่ในสายตรงของนายกรัฐมนตรี","อยู่ใต้ปลัดกระทรวงสาธารณสุข","อยู่ใต้ผู้ว่าราชการจังหวัด","อยู่ใต้รัฐสภา","อยู่ใต้ศาลปกครอง","สำนักงานตำรวจแห่งชาติเป็นส่วนราชการระดับกรมที่อยู่ในสายตรงของนายกรัฐมนตรี"],
["เจ้าของร้านอาหารจอดรถส่งของเกินเวลาที่กำหนดไปเพียง 10 นาที เจ้าหน้าที่จึงสั่งเพิกถอนใบอนุญาตประกอบกิจการถาวรทันที การใช้ดุลพินิจนี้บกพร่องที่หลักใดมากที่สุด", "หลักความได้สัดส่วน เพราะมาตรการหนักเกินกว่าเหตุและเกินความจำเป็น", "หลักความเสมอภาค เพราะเจ้าของร้านควรได้รับโทษเท่ากับผู้ประกอบการรายอื่นทุกราย", "ไม่บกพร่อง เพราะดุลพินิจเป็นอำนาจเด็ดขาดของเจ้าหน้าที่ ตรวจสอบไม่ได้", "หลักความสุจริต เพราะการสั่งลงโทษย่อมแสดงว่าเจ้าหน้าที่มีอคติเสมอ", "หลักความสมเหตุสมผล เพราะเจ้าหน้าที่ไม่มีข้อมูลใดประกอบการตัดสินใจเลย", "ดุลพินิจที่ดีต้องอยู่ในกรอบกฎหมายและได้สัดส่วน ไม่เกินความจำเป็นและไม่กระทบสิทธิเกินสมควร การใช้อำนาจเกินความจำเป็นจึงเป็นการใช้ดุลพินิจโดยมิชอบ"],
["ผู้ประกอบการได้รับใบอนุญาตมาโดยยื่นเอกสารรับรองที่ปลอมแปลง ต่อมาหน่วยงานตรวจพบความจริง ข้อใดวิเคราะห์ถูกต้องที่สุด", "หน่วยงานมีเหตุเพิกถอนคำสั่งอนุญาตได้ เพราะได้มาจากการแสดงข้อมูลเป็นเท็จ และต้องแจ้งผู้เกี่ยวข้องทราบ", "เพิกถอนไม่ได้ เพราะคำสั่งอนุญาตออกโดยหน่วยงานเอง จึงถือว่าชอบด้วยกฎหมายแล้ว", "เพิกถอนได้ แต่ต้องรอให้ศาลปกครองมีคำพิพากษาก่อนทุกกรณี", "ต้องคงใบอนุญาตไว้ เพราะการเพิกถอนจะลดความเชื่อมั่นต่อฝ่ายปกครอง", "แก้ไขได้เพียงชื่อผู้ถือใบอนุญาต โดยไม่ต้องเพิกถอนคำสั่งเดิม", "เหตุแห่งการเพิกถอนรวมถึงการได้มาจากข้อมูลเท็จ จุดประสงค์คือแก้ไขคำสั่งที่ไม่ชอบ รักษาประโยชน์สาธารณะ และเมื่อเพิกถอนต้องแจ้งให้ผู้เกี่ยวข้องรับทราบ"],
["ผู้ขอรับสวัสดิการถูกปฏิเสธคำขอ และต้องการให้ทบทวนคำสั่งอย่างรวดเร็วและประหยัดก่อนถึงขั้นฟ้องคดี ควรเลือกทางใดและเพราะเหตุใด", "ยื่นอุทธรณ์ต่อหน่วยงานที่ออกคำสั่ง เพราะทบทวนได้เร็ว ประหยัด และลดข้อพิพาทก่อนขึ้นสู่ศาล", "ฟ้องศาลปกครองทันที เพราะการอุทธรณ์ไม่ช่วยให้คำสั่งถูกทบทวนได้เลย", "ร้องเรียนทางสื่อมวลชนแทน เพราะกฎหมายไม่รับรองสิทธิอุทธรณ์ของประชาชน", "ขอให้เจ้าหน้าที่คนเดิมออกคำสั่งใหม่ด้วยวาจา โดยไม่ต้องยื่นเป็นลายลักษณ์อักษร", "รอให้ผู้บริหารเปลี่ยนตัวแล้วจึงยื่นคำขอใหม่ เพื่อให้ได้คำสั่งที่ต่างออกไป", "การอุทธรณ์คือการขอให้ฝ่ายปกครองทบทวนคำสั่ง ผลอาจเป็นยืนยัน แก้ไข หรือเพิกถอน จึงให้ความเป็นธรรม รวดเร็ว และประหยัดกว่าการดำเนินคดี"],
["ข้าราชการ ก. มาปฏิบัติราชการสายเป็นประจำ ส่วนข้าราชการ ข. ปลอมเอกสารราชการเพื่อเบิกเงิน ข้อใดวิเคราะห์การลงโทษทางวินัยได้เหมาะสมที่สุด", "ก. เข้าข่ายวินัยไม่ร้ายแรง โทษเบา เช่น ภาคทัณฑ์หรือตัดเงินเดือน ส่วน ข. เป็นวินัยร้ายแรง อาจถึงไล่ออก", "ทั้งสองเป็นวินัยร้ายแรง จึงต้องไล่ออกเท่ากันเพื่อความเสมอภาค", "ทั้งสองเป็นวินัยไม่ร้ายแรง จึงลงโทษเพียงภาคทัณฑ์เท่ากัน", "ก. ร้ายแรงกว่า เพราะเกิดซ้ำทุกวัน ส่วน ข. เป็นเพียงเรื่องจริยธรรมส่วนตัว", "ไม่ต้องลงโทษทั้งคู่ เพราะวินัยเป็นเรื่องความประพฤติส่วนบุคคล", "โทษต้องเหมาะสมกับความร้ายแรงของการกระทำ การมาสายเป็นวินัยไม่ร้ายแรง ส่วนการปลอมเอกสารราชการและทุจริตเป็นวินัยร้ายแรง โทษสูงสุดคือไล่ออก"],
["เจ้าหน้าที่ทำเอกสารสำคัญของประชาชนสูญหายด้วยความประมาท ประชาชนเสียหายต้องเสียค่าใช้จ่ายทำใหม่ ข้อใดแยกความต่างระหว่างความผิดทางวินัยกับความรับผิดทางละเมิดได้ถูกต้อง", "ละเมิดมุ่งชดใช้ความเสียหายแก่ประชาชน ส่วนวินัยมุ่งรักษาระเบียบราชการและลงโทษเจ้าหน้าที่", "ทั้งสองอย่างมุ่งชดใช้ค่าเสียหายแก่ประชาชนเหมือนกัน จึงเรียกซ้ำกันได้", "วินัยมีประชาชนเป็นผู้เสียหาย ส่วนละเมิดมีราชการเป็นผู้เสียหาย", "หากถูกลงโทษทางวินัยแล้ว ประชาชนก็หมดสิทธิเรียกค่าเสียหายจากรัฐ", "ละเมิดใช้ลงโทษ เช่น ภาคทัณฑ์ ส่วนวินัยใช้กำหนดค่าสินไหมทดแทน", "วินัยเกี่ยวกับการรักษาระเบียบราชการ ผู้เสียหายคือราชการ ผลคือโทษทางวินัย ส่วนละเมิดผู้เสียหายคือประชาชน ผลคือการชดใช้ค่าสินไหมทดแทน สองเรื่องแยกจากกัน"],
["ข้าราชการ ก. ถูกคำสั่งลงโทษตัดเงินเดือน ส่วนข้าราชการ ข. เห็นว่าตนไม่ได้รับความเป็นธรรมจากการบริหารงานบุคคล เช่น ถูกละเลยในการเลื่อนตำแหน่ง ทั้งสองควรใช้กลไกใดตามลำดับ", "ก. ใช้การอุทธรณ์คัดค้านคำสั่งลงโทษ ส่วน ข. ใช้การร้องทุกข์เพื่อขอให้แก้ไขความไม่เป็นธรรม", "ก. ใช้การร้องทุกข์ ส่วน ข. ใช้การอุทธรณ์คำสั่งลงโทษ", "ทั้งสองต้องใช้การอุทธรณ์เท่านั้น เพราะการร้องทุกข์ไม่มีในระบบราชการ", "ทั้งสองต้องฟ้องศาลทันที โดยไม่ผ่านกลไกภายในหน่วยงาน", "ทั้งสองไม่มีสิทธิใช้กลไกใด เพราะเป็นเรื่องภายในราชการ", "การอุทธรณ์ใช้คัดค้านคำสั่งลงโทษทางวินัยหรือคำสั่งทางบุคคล ส่วนการร้องทุกข์ใช้เมื่อเห็นว่าตนไม่ได้รับความเป็นธรรมจากการบริหารงานบุคคล ทั้งสองคุ้มครองสิทธิและลดข้อพิพาทก่อนเข้าศาล"],
["ประชาชนขอสำเนาแฟ้มสอบสวนคดีอาญาที่ยังอยู่ระหว่างดำเนินการ โดยอ้างสิทธิรับรู้ข้อมูลข่าวสารของรัฐ หน่วยงานควรพิจารณาอย่างไร", "ปฏิเสธได้หากการเปิดเผยอาจกระทบกระบวนการยุติธรรม เพราะเป็นข้อยกเว้นที่กฎหมายกำหนด", "ต้องเปิดเผยทุกกรณี เพราะสิทธิรับรู้ข้อมูลของประชาชนไม่มีข้อยกเว้นใดเลย", "ปฏิเสธได้ทุกเรื่อง เพียงหน่วยงานเห็นว่าไม่สะดวกต่อการทำงาน", "เปิดเผยทั้งหมดทันที เพราะประโยชน์สาธารณะอยู่เหนือกระบวนการยุติธรรมเสมอ", "ให้เปิดเผยเฉพาะข้อมูลส่วนบุคคลของผู้ถูกกล่าวหา เพื่อให้สังคมตรวจสอบ", "หลักคือข้อมูลต้องเปิดเผย แต่กฎหมายมีข้อยกเว้น เช่น ข้อมูลคดีเพื่อป้องกันผลกระทบต่อกระบวนการยุติธรรม หน่วยงานต้องอ้างเหตุตามข้อยกเว้น ไม่ใช่ปฏิเสธตามอำเภอใจ"],
["เจ้าหน้าที่คนเดียวทำหน้าที่ทั้งอนุมัติ เบิกจ่าย และเก็บรักษาเงินสดของหน่วยงาน โดยไม่มีผู้ตรวจทาน กรณีนี้ขาดองค์ประกอบใดของการควบคุมภายในตามกรอบ COSO มากที่สุด", "กิจกรรมการควบคุม เช่น การแบ่งแยกหน้าที่และการตรวจสอบเพื่อป้องกันการทุจริต", "สารสนเทศและการสื่อสาร เพราะหน่วยงานไม่มีระบบจัดการข้อมูลเลย", "การประเมินความเสี่ยง เพราะยังไม่ได้วิเคราะห์ปัญหางบประมาณปีหน้า", "การติดตามประเมินผล เพราะไม่มีรายงานสรุปผลสิ้นปี", "สภาพแวดล้อมการควบคุม เพราะวัฒนธรรมองค์กรสำคัญกว่ามาตรการปฏิบัติเสมอ", "กิจกรรมการควบคุมคือมาตรการป้องกันและตรวจสอบ การให้คนเดียวถือหลายหน้าที่ต่อเนื่องโดยไม่มีผู้ตรวจทาน ทำให้เปิดช่องต่อการทุจริตและความผิดพลาด"],
["หน่วยงานต้องการทราบว่าโครงการแจกเครื่องมือการเกษตรปีที่ผ่านมาใช้งบประมาณคุ้มค่าและบรรลุเป้าหมายหรือไม่ ควรเลือกการตรวจสอบประเภทใด", "Performance Audit เพราะประเมินประสิทธิภาพและความคุ้มค่าของการดำเนินงาน", "Financial Audit เพราะตรวจความถูกต้องของบัญชีก็ตอบเรื่องความคุ้มค่าได้ครบ", "Compliance Audit เพราะตรวจว่าถูกต้องตามกฎหมายแล้วย่อมแปลว่าคุ้มค่า", "ไม่ต้องตรวจสอบเพิ่ม เพราะมีการควบคุมภายในอยู่แล้ว", "Financial และ Compliance Audit เท่านั้น ถือว่าครบทุกมิติ", "Financial Audit ตรวจความถูกต้องของบัญชี Compliance Audit ตรวจความถูกต้องตามกฎหมาย ส่วน Performance Audit ประเมินประสิทธิภาพและความคุ้มค่า ซึ่งตรงกับโจทย์"],
["หน่วยงานระบุและวิเคราะห์ความเสี่ยงของโครงการจัดซื้อแล้ว และประเมินว่ามีระดับความเสี่ยงสูง ขั้นตอนถัดไปตามวงจรการบริหารความเสี่ยงควรเป็นข้อใด", "กำหนดมาตรการควบคุม แล้วติดตามและทบทวนอย่างต่อเนื่อง", "กลับไประบุความเสี่ยงใหม่ทั้งหมด โดยยังไม่ต้องมีมาตรการใด", "ข้ามไปติดตามและทบทวนทันที โดยไม่ต้องกำหนดมาตรการควบคุม", "ยกเลิกโครงการทุกกรณีที่มีความเสี่ยงสูง", "รายงานว่าไม่มีความเสี่ยง เพราะวิเคราะห์เสร็จสิ้นแล้ว", "วงจรคือ ระบุ วิเคราะห์ ประเมิน กำหนดมาตรการควบคุม แล้วติดตามและทบทวน เมื่อประเมินความเสี่ยงแล้วจึงต้องกำหนดมาตรการจัดการ"],
["ประธานกรรมการพิจารณาผลการจัดซื้อจัดจ้างมีภรรยาเป็นเจ้าของบริษัทที่เข้าเสนอราคา กรณีนี้เป็นผลประโยชน์ทับซ้อนรูปแบบใด และควรจัดการอย่างไร", "ความสัมพันธ์ส่วนบุคคล ควรเปิดเผยข้อมูลและแยกตัวออกจากการพิจารณา", "ผลประโยชน์ในอนาคต ควรร่วมพิจารณาต่อโดยไม่ต้องเปิดเผย", "การใช้ข้อมูลภายใน ควรให้บริษัทถอนการเสนอราคาเสมอ", "ผลประโยชน์ทางการเงิน ควรร่วมพิจารณาแต่เว้นลงคะแนนครั้งสุดท้าย", "ไม่ใช่ผลประโยชน์ทับซ้อน เพราะภรรยาไม่ใช่เจ้าหน้าที่ของรัฐ", "เมื่อบุคคลใกล้ชิดเกี่ยวข้องกับการตัดสินใจ ถือเป็นผลประโยชน์ทับซ้อนแบบความสัมพันธ์ส่วนบุคคล แนวทางป้องกันคือเปิดเผยข้อมูลและแยกบทบาทหน้าที่"],
["เจ้าหน้าที่ฝ่ายผังเมืองรู้ล่วงหน้าว่าจะมีการตัดถนนผ่านที่ดินแปลงหนึ่ง จึงให้ญาติซื้อที่ดินไว้ก่อนแล้วขายต่อทำกำไร พฤติกรรมนี้สะท้อนปัญหาใดชัดที่สุด", "การใช้ข้อมูลภายในเพื่อประโยชน์ส่วนตน ซึ่งเป็นผลประโยชน์ทับซ้อนและเข้าข่ายทุจริต", "การรับของขวัญจากผู้มีส่วนได้เสีย ซึ่งเป็นเพียงมารยาททางสังคม", "การใช้ดุลพินิจโดยชอบ เพราะเจ้าหน้าที่ไม่ได้รับเงินจากราชการโดยตรง", "ความเสี่ยงด้านเทคโนโลยี จากการรั่วไหลของระบบสารสนเทศ", "ความล่าช้าของโครงการ ซึ่งเป็นความเสี่ยงด้านการดำเนินงาน", "การนำข้อมูลราชการไปแสวงหากำไรให้ตนหรือบุคคลใกล้ชิดเป็นการใช้ข้อมูลภายใน และตรงกับนิยามทุจริต คือใช้อำนาจหน้าที่เพื่อประโยชน์ส่วนตน"],
["หน่วยงานแห่งหนึ่งเพิ่มโทษผู้ทุจริตให้รุนแรงขึ้นทุกปี แต่ไม่ปลูกฝังค่านิยมซื่อสัตย์และไม่เปิดข้อมูลให้ตรวจสอบ ทุจริตจึงยังเกิดซ้ำ ตามแนวทางสมัยใหม่ควรปรับอย่างไร", "สร้างวัฒนธรรมองค์กรสุจริต ควบคู่การเปิดเผยข้อมูลและเพิ่มการตรวจสอบจากประชาชน", "เพิ่มโทษหนักขึ้นอีกเพียงอย่างเดียว เพราะการลงโทษคือหัวใจของการต่อต้านทุจริต", "ลดการเปิดเผยข้อมูล เพื่อไม่ให้ผู้ทุจริตเรียนรู้ช่องโหว่", "ให้ผู้บริหารตรวจสอบเองแทนหน่วยตรวจสอบภายใน", "ยกเลิกการส่งเสริมจริยธรรม เพราะไม่เห็นผลทันที", "แนวทางสมัยใหม่ไม่เน้นเพียงการลงโทษ แต่สร้าง Integrity Culture และใช้ธรรมาภิบาลช่วยลดช่องว่างการใช้อำนาจมิชอบ พร้อมเพิ่มการตรวจสอบจากภาคประชาชน"],
["แอปลงทะเบียนอบรมของหน่วยงานรัฐขอเลขบัตรประชาชน ศาสนา และกรุ๊ปเลือดจากผู้สมัครทุกคน ทั้งที่การอบรมไม่เกี่ยวข้องกับข้อมูลเหล่านี้ ขัดกับแนวทางใดของ PDPA มากที่สุด", "การเก็บข้อมูลเท่าที่จำเป็นตามวัตถุประสงค์", "สิทธิขอลบข้อมูลของเจ้าของข้อมูลหลังอบรมเสร็จ", "การเปิดเผยข้อมูลเฉพาะผู้มีอำนาจ", "การแต่งตั้งผู้รับผิดชอบด้านข้อมูลส่วนบุคคล (DPO)", "สิทธิแก้ไขข้อมูลที่ไม่ถูกต้อง", "กรอบ PDPA เริ่มจากการเก็บข้อมูลเท่าที่จำเป็นตามวัตถุประสงค์ การขอข้อมูลที่ไม่เกี่ยวกับการอบรมจึงเกินความจำเป็น"],
["เว็บไซต์ยื่นคำขอออนไลน์ของหน่วยงานรัฐถูกโจมตีแบบ DDoS จนล่มทั้งวัน ประชาชนใช้บริการไม่ได้ แม้ข้อมูลในระบบไม่รั่วไหลและไม่ถูกแก้ไข กรณีนี้กระทบองค์ประกอบใดของ CIA Triad โดยตรง", "Availability (ความพร้อมใช้งาน)", "Confidentiality (ความลับของข้อมูล)", "Integrity (ความถูกต้องครบถ้วน)", "Confidentiality และ Integrity เท่านั้น", "ไม่กระทบองค์ประกอบใดเลย เพราะข้อมูลยังอยู่ครบ", "DDoS ทำให้ระบบไม่สามารถให้บริการได้ ระบบจึงไม่พร้อมใช้งานเมื่อจำเป็น ส่วนข้อมูลที่ไม่รั่วและไม่ถูกแก้ไขหมายความว่า Confidentiality และ Integrity ยังไม่ถูกกระทบ"],
  ["ตามแนวคิดของ Max Weber ข้อใดเป็นลักษณะของระบบราชการที่มีประสิทธิภาพ", "มีลำดับชั้นการบังคับบัญชาชัดเจน แบ่งงานตามความเชี่ยวชาญ ใช้กฎระเบียบที่เป็นลายลักษณ์อักษร และปฏิบัติงานอย่างเป็นกลาง", "ตัดสินใจตามความสัมพันธ์ส่วนบุคคลของผู้บังคับบัญชาเพื่อให้เกิดความรวดเร็ว", "เน้นวัดผลสัมฤทธิ์และมองประชาชนเป็นลูกค้าที่ต้องพึงพอใจ", "กระจายอำนาจให้องค์กรในพื้นที่ ทำงานยืดหยุ่นคล่องตัวโดยไม่ยึดกฎเกณฑ์", "รวมอำนาจไว้ที่ผู้นำสูงสุดและเปิดให้ใช้ดุลพินิจส่วนบุคคลได้เต็มที่", "Max Weber ระบุองค์ประกอบของระบบราชการที่มีประสิทธิภาพ คือ ลำดับชั้นบังคับบัญชาชัดเจน แบ่งงานตามความเชี่ยวชาญ กฎระเบียบเป็นลายลักษณ์อักษร และปฏิบัติงานเป็นกลางคาดการณ์ผลได้ ข้อ ข คือแนวคิด NPM ข้อ ง คือลักษณะของ NPM (กระจายอำนาจ ยืดหยุ่น) ข้อ ก และ จ ตรงข้ามกับหลักเหตุผลของ Weber"],
  ["ข้อใดไม่ใช่การเปลี่ยนแปลงสำคัญในการปฏิรูประบบราชการสมัยรัชกาลที่ 5", "คงระบบจตุสดมภ์ (เวียง วัง คลัง นา) ไว้เป็นโครงสร้างหลักในการแบ่งงานราชการ", "จัดระบบกระทรวง ทบวง กรม และกำหนดหน้าที่ของแต่ละหน่วยงานให้ชัดเจน", "จัดระบบเทศาภิบาลเพื่อให้ส่วนกลางบริหารและควบคุมหัวเมืองได้อย่างเป็นระบบ", "ยกเลิกระบบไพร่และระบบทาสตามลำดับ ทำให้ความสัมพันธ์ระหว่างรัฐกับประชาชนเปลี่ยนไป", "กำหนดตำแหน่งและหน้าที่ของข้าราชการ และเริ่มใช้กฎ ระเบียบที่เป็นทางการมากขึ้น", "ระบบจตุสดมภ์เป็นระบบของสมัยอยุธยาและต้นรัตนโกสินทร์ สมัยรัชกาลที่ 5 เปลี่ยนเป็นระบบกระทรวง ทบวง กรม ข้ออื่นเป็นการเปลี่ยนแปลงที่เกิดขึ้นจริง"],
  ["Osborne & Gaebler เสนอว่าภาครัฐควรเปลี่ยนบทบาทจาก \"ผู้พายเรือ\" เป็น \"ผู้กำกับหางเสือ\" ข้อความนี้หมายถึงข้อใด", "รัฐควรควบคุมทิศทางและกำหนดนโยบาย โดยเปิดให้เอกชนแข่งขันและร่วมจัดทำบริการแทนการทำเองทุกอย่าง", "รัฐควรลงมือทำเองทุกอย่างเพื่อควบคุมคุณภาพของบริการได้อย่างเต็มที่", "รัฐควรรวมศูนย์อำนาจและเพิ่มลำดับชั้นการบังคับบัญชาให้เข้มงวดขึ้น", "รัฐควรเน้นให้เจ้าหน้าที่ทำตามขั้นตอนอย่างถูกต้องมากกว่าการดูผลลัพธ์ของงาน", "รัฐควรถอนตัวจากการกำหนดนโยบายทั้งหมดและให้เอกชนตัดสินใจแทน", "ภาครัฐเป็น \"ผู้กำกับหางเสือ\" คือควบคุมทิศทางและกำหนดนโยบาย ส่วนการลงมือทำเปิดให้เอกชนแข่งขันและร่วมจัดทำได้ ตรงข้ามกับแบบเดิมที่รัฐทำเองทุกอย่าง (ผู้พายเรือ)"],
  ["ผู้อำนวยการสำนักงานแห่งหนึ่งออกคำสั่งห้ามประชาชนเข้าใช้พื้นที่สาธารณะ โดยอ้างว่า \"ไม่มีกฎหมายฉบับใดห้ามว่าผมออกคำสั่งนี้ไม่ได้\" ข้ออ้างดังกล่าวขัดกับหลักการใดมากที่สุด", "หลักที่ว่าองค์กรของรัฐทำได้ต่อเมื่อมีกฎหมายให้อำนาจ อำนาจของรัฐเริ่มต้นที่ศูนย์และต้องมีกฎหมายเป็นผู้ริเริ่ม", "ประชาชนทำได้ทุกอย่างตราบเท่าที่กฎหมายไม่ห้าม ดังนั้นเจ้าหน้าที่จึงทำได้เช่นเดียวกัน", "หลักการแบ่งแยกอำนาจ ซึ่งกำหนดให้ฝ่ายตุลาการเป็นผู้ออกคำสั่งทางปกครอง", "หลักความได้สัดส่วน ซึ่งห้ามเจ้าหน้าที่ออกคำสั่งที่กระทบสิทธิประชาชนทุกกรณี", "หลักการมอบอำนาจ ซึ่งกำหนดว่าผู้บังคับบัญชาต้องมอบอำนาจให้ผู้ใต้บังคับบัญชาก่อนออกคำสั่ง", "ตามหลักของ Dicey ประชาชนทำได้ทุกอย่างตราบที่กฎหมายไม่ห้าม แต่องค์กรของรัฐทำได้ต่อเมื่อมีกฎหมายให้อำนาจ อำนาจเริ่มที่ศูนย์ ข้ออ้างของผู้อำนวยการจึงใช้หลักของประชาชนมาใช้กับเจ้าหน้าที่ซึ่งผิดหลัก"],
  ["ข้อใดอธิบายการบริหารราชการส่วนภูมิภาคได้ถูกต้อง", "เป็นการแบ่งอำนาจ จังหวัดมีฐานะเป็นนิติบุคคลและตั้งหรือยุบโดยตราเป็นพระราชบัญญัติ ส่วนอำเภอตั้งหรือยุบโดยพระราชกฤษฎีกา", "เป็นการกระจายอำนาจ จังหวัดและอำเภอมีฐานะเป็นนิติบุคคลเหมือนกัน", "เป็นการรวมอำนาจ จังหวัดและอำเภอตั้งหรือยุบโดยพระราชกฤษฎีกาเหมือนกัน", "เป็นการแบ่งอำนาจ จังหวัดตั้งหรือยุบโดยพระราชกฤษฎีกา ส่วนอำเภอตั้งหรือยุบโดยพระราชบัญญัติ", "เป็นการกระจายอำนาจ ผู้ว่าราชการจังหวัดมาจากการเลือกตั้งโดยตรงของประชาชน", "ส่วนภูมิภาคคือการแบ่งอำนาจ (Deconcentration) จังหวัดเป็นนิติบุคคล ตั้ง ยุบ หรือเปลี่ยนเขตโดยพระราชบัญญัติ อำเภอตั้ง ยุบ หรือเปลี่ยนเขตโดยพระราชกฤษฎีกา จึงทำได้รวดเร็วกว่า"],
  ["ข้อใดอธิบายความแตกต่างระหว่าง \"การมอบอำนาจ\" กับ \"การกระจายอำนาจ\" ได้ถูกต้อง", "การมอบอำนาจ ผู้รับอำนาจยังอยู่ในสายการบังคับบัญชาและผู้มอบยังคงต้องรับผิดชอบ ส่วนการกระจายอำนาจ ผู้รับเป็นองค์กรอิสระในพื้นที่และรับผิดชอบโดยตรงตามกฎหมาย", "การมอบอำนาจ ผู้รับเป็นองค์กรอิสระและผู้มอบพ้นจากความรับผิดชอบ ส่วนการกระจายอำนาจ ผู้รับยังอยู่ในสายการบังคับบัญชา", "ทั้งสองอย่างเป็นการโอนความเป็นเจ้าของอำนาจให้พื้นที่รับผิดชอบตนเองเหมือนกัน", "การมอบอำนาจเป็นการแบ่งอำนาจไปยังภูมิภาค ส่วนการกระจายอำนาจเป็นการรวมอำนาจไว้ที่ส่วนกลาง", "การมอบอำนาจไม่ต้องมีกฎหมายรองรับ แต่การกระจายอำนาจต้องมีกฎหมายรองรับ", "การมอบอำนาจคือ \"ยืมมือทำ\" ผู้รับยังอยู่ในสายบังคับบัญชา ผู้มอบยังคงรับผิดชอบ การกระจายอำนาจคือตัดแบ่งความเป็นเจ้าของให้พื้นที่ ซึ่งเป็นองค์กรอิสระรับผิดชอบตามกฎหมายของตน"],
  ["ท้องถิ่นแห่งหนึ่งมีประชากร 52,000 คน และมีรายได้พอควร ควรได้รับการจัดตั้งเป็นองค์กรปกครองส่วนท้องถิ่นรูปแบบใด และมีสมาชิกสภากี่คน", "เทศบาลนคร สภามีสมาชิก 24 คน", "เทศบาลเมือง สภามีสมาชิก 18 คน", "เทศบาลตำบล สภามีสมาชิก 12 คน", "องค์การบริหารส่วนตำบล สภามีสมาชิกหมู่บ้านละ 2 คน", "องค์การบริหารส่วนจังหวัด สภามีสมาชิก 24 คน", "เทศบาลนคร คือชุมชนขนาดใหญ่ประชากร 50,000 คนขึ้นไปและมีรายได้พอควร สภาเทศบาล 24 คน (เทศบาลเมืองสภา 18 คน เทศบาลตำบลสภา 12 คน)"],
  ["หน่วยงานแห่งหนึ่งเพิกถอนใบอนุญาตของผู้ประกอบการรายหนึ่งโดยไม่เปิดโอกาสให้ผู้นั้นชี้แจงข้อเท็จจริงก่อน แม้หน่วยงานจะมีอำนาจตามกฎหมายในการเพิกถอน ข้อใดวิเคราะห์ได้ถูกต้อง", "ไม่ชอบ เพราะขัดหลักการรับฟังข้อเท็จจริง (Audi Alteram Partem) แม้มีอำนาจตามกฎหมาย ก็ต้องคำนึงถึงสิทธิของผู้ได้รับผลกระทบและหลักความเป็นธรรมทางปกครอง", "ชอบด้วยกฎหมาย เพราะเมื่อมีอำนาจตามกฎหมายแล้วไม่จำเป็นต้องรับฟังผู้ใด", "ชอบด้วยกฎหมาย เพราะการเพิกถอนเป็นเรื่องของดุลพินิจโดยสมบูรณ์", "ไม่ชอบ เพราะผู้ประกอบการต้องยื่นอุทธรณ์ก่อนจึงจะเพิกถอนได้", "ไม่ชอบ เพราะการเพิกถอนใบอนุญาตต้องให้ศาลเป็นผู้สั่งเท่านั้น", "หลักรับฟังข้อเท็จจริง (Audi Alteram Partem) เป็นหัวใจของกระบวนการที่เป็นธรรม (Due Process) แม้หน่วยงานมีอำนาจตามกฎหมาย อำนาจต้องมาคู่กับความเป็นธรรม"],
  ["ข้อใดไม่ใช่เหตุแห่งการเพิกถอนคำสั่งทางปกครองตามเนื้อหาที่ได้ศึกษา", "ผู้ได้รับคำสั่งไม่พอใจผลของคำสั่งนั้น", "คำสั่งออกโดยผู้ไม่มีอำนาจ", "คำสั่งขัดต่อกฎหมาย", "คำสั่งได้มาจากการแสดงข้อมูลเป็นเท็จ", "คำสั่งมีข้อผิดพลาดในสาระสำคัญ", "เหตุแห่งการเพิกถอน ได้แก่ ออกโดยผู้ไม่มีอำนาจ ขัดต่อกฎหมาย มีข้อผิดพลาดในสาระสำคัญ ได้มาจากข้อมูลเท็จ และขัดต่อประโยชน์สาธารณะ ความไม่พอใจของผู้ได้รับคำสั่งไม่ใช่เหตุ"],
  ["ผู้อำนวยการกองแห่งหนึ่งเสนอเลื่อนตำแหน่งให้ญาติของตน ทั้งที่ผลงานและสมรรถนะต่ำกว่าข้าราชการคนอื่นในกอง กรณีนี้สะท้อนสิ่งใด", "ระบบอุปถัมภ์ ซึ่งขัดหลักความรู้ความสามารถและหลักความเสมอภาค และทำให้ผู้มีความสามารถเสียกำลังใจ", "หลักคุณธรรมด้านความมั่นคงในอาชีพ เพราะญาติได้รับความคุ้มครองตามกฎหมาย", "หลักความเป็นกลางทางการเมือง เพราะไม่ได้ใช้ตำแหน่งเพื่อประโยชน์ทางการเมือง", "การประเมินผลแบบมุ่งผลสัมฤทธิ์ (Performance-Based Management) ที่ถูกต้อง", "การบริหารผลงานอย่างต่อเนื่อง ซึ่งเน้นการให้คำปรึกษาแนะนำผู้ใต้บังคับบัญชา", "การเลือกคนโดยอาศัยความสัมพันธ์ ไม่พิจารณาความสามารถ คือระบบอุปถัมภ์ ซึ่งขัดหลักคุณธรรม (ความรู้ความสามารถ ความเสมอภาค) และทำให้คนเก่งหมดกำลังใจ นำไปสู่ประสิทธิภาพและความเชื่อมั่นที่ลดลง"],
  ["พฤติกรรมของข้าราชการในข้อใดจัดเป็นความผิดทางวินัยอย่างร้ายแรง", "รับผลประโยชน์หรือสินบนโดยมิชอบจากผู้มาติดต่อราชการ", "มาปฏิบัติราชการสายเป็นบางครั้ง", "ปฏิบัติราชการไม่เรียบร้อยเนื่องจากไม่เอาใจใส่", "ละเลยหน้าที่ราชการเล็กน้อย", "ไม่รักษาความสามัคคีในหมู่คณะ", "วินัยอย่างร้ายแรงได้แก่ ทุจริตต่อหน้าที่ รับสินบน ปลอมเอกสารราชการ เปิดเผยความลับราชการ ละทิ้งหน้าที่ติดต่อกันหลายวัน ข้อ ข ค ง จ เป็นวินัยอย่างไม่ร้ายแรง"],
  ["นายเดชาเป็นข้าราชการ จงใจแอบนำรถราชการไปซื้อของส่วนตัวหน้ามหาวิทยาลัยแห่งหนึ่ง ขณะขับรถออกไปได้เกิดอุบัติเหตุชนคนเดินถนนได้รับบาดเจ็บ ข้อใดอธิบายความรับผิดของนายเดชาได้ถูกต้องที่สุด", "นายเดชาอาจต้องรับผิดเต็มจำนวนเพราะกระทำโดยจงใจ และความรับผิดทางละเมิดกับความรับผิดทางวินัยเป็นคนละเรื่องกัน จึงอาจถูกลงโทษทางวินัยได้ด้วย", "หน่วยงานรับผิดชดใช้เต็มจำนวน นายเดชาไม่ต้องรับผิดใด ๆ เพราะเป็นการประมาททั่วไป", "นายเดชารับผิดทางวินัยเท่านั้น เพราะความผิดทางวินัยครอบคลุมความรับผิดทางละเมิดแล้ว", "นายเดชารับผิดทางละเมิดเท่านั้น เพราะการลงโทษทางวินัยใช้เฉพาะกรณีที่ความเสียหายเกิดแก่ประชาชน", "นายเดชาไม่ต้องรับผิดใด ๆ เพราะเป็นข้าราชการจึงได้รับความคุ้มครองตามกฎหมาย", "การกระทำโดยจงใจ เจ้าหน้าที่ต้องรับผิดเต็มจำนวน (ตามตารางลักษณะความรับผิดในบทที่ 6) และความผิดทางวินัย (รักษาระเบียบราชการ ลงโทษทางวินัย) กับความรับผิดทางละเมิด (ชดใช้ความเสียหายแก่ผู้เสียหาย) เป็นคนละเรื่อง จึงเกิดขึ้นพร้อมกันได้"],
  ["เจ้าหน้าที่คนหนึ่งขับรถราชการไปปฏิบัติภารกิจของหน่วยงาน เกิดความประมาทเลินเล่อทั่วไปจนชนรถของประชาชนได้รับความเสียหาย ตามหลัก พ.ร.บ. ความรับผิดทางละเมิดของเจ้าหน้าที่ พ.ศ. 2539 ข้อใดถูกต้อง", "หน่วยงานของรัฐต้องรับผิดชดใช้ค่าสินไหมทดแทนแก่ผู้เสียหายก่อน และไม่ไล่เบี้ยเจ้าหน้าที่ เพราะไม่ใช่การกระทำโดยจงใจหรือประมาทเลินเล่ออย่างร้ายแรง", "เจ้าหน้าที่ต้องชดใช้เต็มจำนวนด้วยตนเองโดยหน่วยงานไม่ต้องรับผิด", "หน่วยงานไล่เบี้ยเจ้าหน้าที่ได้ทุกกรณีที่เกิดความเสียหาย", "ผู้เสียหายต้องฟ้องเจ้าหน้าที่เป็นการส่วนตัวเท่านั้น", "ไม่มีผู้ใดต้องรับผิด เพราะเกิดขึ้นระหว่างปฏิบัติหน้าที่", "หลักสำคัญคือหน่วยงานของรัฐรับผิดชดใช้ผู้เสียหายก่อน แล้วไล่เบี้ยได้เฉพาะเมื่อเจ้าหน้าที่จงใจหรือประมาทเลินเล่ออย่างร้ายแรง กรณีประมาททั่วไป หน่วยงานรัฐรับผิด"],
  ["ประชาชนรายหนึ่งยื่นคำขอสำเนารายงานการใช้จ่ายงบประมาณของหน่วยงานรัฐ แต่หน่วยงานปฏิเสธโดยไม่ได้อ้างข้อยกเว้นใดตามกฎหมาย ข้อใดถูกต้อง", "ไม่ถูกต้อง เพราะหลักคือข้อมูลข่าวสารของราชการต้องเปิดเผย เว้นแต่กฎหมายกำหนดให้ปกปิด ประชาชนสามารถอุทธรณ์คำสั่งไม่เปิดเผยและร้องเรียนต่อคณะกรรมการข้อมูลข่าวสารได้", "ถูกต้อง เพราะข้อมูลข่าวสารของราชการต้องปกปิดเป็นหลัก เว้นแต่กฎหมายกำหนดให้เปิดเผย", "ถูกต้อง เพราะประชาชนมีสิทธิเพียงตรวจดูข้อมูล แต่ไม่มีสิทธิคัดสำเนา", "ถูกต้อง เพราะงบประมาณเป็นข้อมูลที่เกี่ยวกับความมั่นคงของรัฐ", "ไม่ถูกต้อง แต่ประชาชนไม่มีช่องทางใดโต้แย้งนอกจากต้องฟ้องศาลทันที", "หลักของ พ.ร.บ. ข้อมูลข่าวสารของราชการ พ.ศ. 2540 คือข้อมูลข่าวสารของราชการต้องเปิดเผย เว้นแต่กฎหมายกำหนดให้ปกปิด ประชาชนมีสิทธิขอข้อมูล ตรวจดู คัดสำเนา อุทธรณ์ และร้องเรียนต่อคณะกรรมการข้อมูลข่าวสาร งบประมาณเป็นข้อมูลประเภทที่เปิดเผยได้"],
  ["กรมสรรพากร (กระทรวงการคลัง) ทำหนังสือขอความร่วมมือไปยังกรมการปกครอง (กระทรวงมหาดไทย) หนังสือฉบับนี้จัดเป็นหนังสือราชการชนิดใดตามระเบียบสำนักนายกรัฐมนตรีว่าด้วยงานสารบรรณ", "หนังสือภายนอก", "หนังสือภายใน", "หนังสือประทับตรา", "หนังสือสั่งการ", "หนังสือประชาสัมพันธ์", "หนังสือภายนอกใช้ติดต่อระหว่างหน่วยงานต่างสังกัด หนังสือภายในใช้ภายในกระทรวงหรือหน่วยงานเดียวกัน กรณีนี้ต่างกระทรวงจึงเป็นหนังสือภายนอก"],
  ["หัวหน้างานให้คะแนนประเมินสูงในทุกด้านแก่ลูกน้องคนหนึ่ง เพียงเพราะลูกน้องคนนี้พูดเก่งและนำเสนองานเก่ง ทั้งที่ผลงานจริงไม่ถึงเป้าหมาย กรณีนี้เป็นอคติในการประเมินผลประเภทใด", "Halo Effect", "Horn Effect", "Recency Effect", "Central Tendency", "Similarity Bias", "Halo Effect คือเห็นข้อดีด้านเดียวแล้วเหมารวมว่าดีทุกด้าน เช่น พูดเก่งจึงคิดว่าทำงานเก่งด้วย"],
  ["หน่วยตรวจสอบเข้าตรวจสอบโครงการของหน่วยงานรัฐว่าใช้งบประมาณอย่างมีประสิทธิภาพและคุ้มค่าหรือไม่ การตรวจสอบนี้จัดเป็นประเภทใด", "การตรวจสอบผลการดำเนินงาน (Performance Audit)", "การตรวจสอบทางการเงิน (Financial Audit)", "การตรวจสอบการปฏิบัติตามกฎระเบียบ (Compliance Audit)", "การตรวจสอบภายในแบบควบคุมความเสี่ยงทางไซเบอร์", "การตรวจสอบทางการเมืองโดยรัฐสภา", "Performance Audit คือการประเมินประสิทธิภาพและความคุ้มค่า Financial Audit ตรวจความถูกต้องของบัญชี Compliance Audit ตรวจความถูกต้องตามกฎหมาย"],
  ["เจ้าหน้าที่พัสดุของหน่วยงานแห่งหนึ่งเสนอให้บริษัทของพี่ชายตนเองเป็นผู้ได้รับงานจ้างของหน่วยงาน ข้อใดวิเคราะห์สถานการณ์และแนวทางป้องกันได้ถูกต้องที่สุด", "เป็นผลประโยชน์ทับซ้อนรูปแบบความสัมพันธ์ส่วนบุคคล ป้องกันได้โดยเปิดเผยข้อมูล แยกบทบาทหน้าที่ และให้มีระบบตรวจสอบถ่วงดุล", "เป็นผลประโยชน์ทับซ้อนด้านผลประโยชน์ในอนาคต ป้องกันได้โดยให้เจ้าหน้าที่รีบลาออก", "เป็นความเสี่ยงด้านเทคโนโลยี ป้องกันได้โดยใช้ระบบ AI คัดเลือกแทน", "ไม่เป็นปัญหา เพราะการจัดซื้อจัดจ้างอยู่ในดุลพินิจของเจ้าหน้าที่พัสดุ", "เป็นผลประโยชน์ทับซ้อนด้านการใช้ข้อมูลภายใน ป้องกันได้โดยไม่เปิดเผยข้อมูลใด ๆ", "ญาติเป็นผู้รับจ้างเป็นผลประโยชน์ทับซ้อนรูปแบบความสัมพันธ์ส่วนบุคคล แนวทางป้องกันคือ เปิดเผยข้อมูล (Disclosure) แยกบทบาทหน้าที่ มีระบบตรวจสอบถ่วงดุล สร้างจริยธรรมองค์กร และความโปร่งใส"],
  ["ข้อใดอธิบายความแตกต่างระหว่างกฎหมายกับจริยธรรมได้ถูกต้อง", "กฎหมายตั้งคำถามว่า \"ทำได้หรือไม่ได้\" มีบทลงโทษชัดเจน ส่วนจริยธรรมตั้งคำถามว่า \"ควรทำหรือไม่ควรทำ\" และสิ่งที่ไม่ผิดกฎหมายไม่ได้แปลว่าเหมาะสมทางจริยธรรมเสมอไป", "กฎหมายตั้งคำถามว่า \"ควรทำหรือไม่ควรทำ\" ส่วนจริยธรรมตั้งคำถามว่า \"ทำได้หรือไม่ได้\"", "กฎหมายและจริยธรรมมีขอบเขตเท่ากันทุกประการ จึงใช้แทนกันได้", "จริยธรรมมีบทลงโทษที่ชัดเจนกว่ากฎหมาย", "หากไม่ผิดกฎหมายแล้ว ย่อมถือว่าเหมาะสมทางจริยธรรมเสมอ", "กฎหมายถามว่า \"ทำได้หรือไม่ได้\" มีบทลงโทษชัดเจนและกำหนดพฤติกรรมขั้นต่ำ จริยธรรมถามว่า \"ควรทำหรือไม่ควรทำ\" และสิ่งที่ไม่ผิดกฎหมายไม่ได้หมายความว่าเหมาะสมทางจริยธรรมเสมอไป"],
  ["ผู้ไม่หวังดีเข้าถึงฐานข้อมูลทะเบียนของหน่วยงานรัฐโดยไม่ได้รับอนุญาตและแก้ไขข้อมูลบางรายการให้คลาดเคลื่อน ตามหลัก CIA Triad ด้านใดถูกละเมิดโดยตรงมากที่สุด", "Integrity (ความถูกต้องครบถ้วนของข้อมูล)", "Confidentiality (ความลับของข้อมูล)", "Availability (ความพร้อมใช้งาน)", "Accountability (ความรับผิดชอบ)", "Transparency (ความโปร่งใส)", "CIA Triad ได้แก่ Confidentiality (เข้าถึงได้เฉพาะผู้มีสิทธิ) Integrity (ข้อมูลถูกต้อง ไม่ถูกแก้ไขโดยมิชอบ) และ Availability (พร้อมใช้งาน) การแก้ไขข้อมูลให้คลาดเคลื่อนคือการละเมิด Integrity โดยตรง"],
  ["หัวหน้าหน่วยงานสั่งให้เจ้าหน้าที่ปิดบริการประชาชนเป็นเวลา 1 เดือน โดยให้เหตุผลเพียงว่า ‘เป็นอำนาจของหัวหน้า’ แต่ไม่สามารถระบุกฎหมายที่ให้อำนาจหรือเหตุจำเป็นได้ ข้อใดเป็นแนววิเคราะห์ที่เหมาะสมที่สุด?", "การใช้อำนาจอาจไม่ชอบด้วยกฎหมาย เพราะหน่วยงานรัฐต้องแสดงฐานอำนาจตามกฎหมาย ไม่ใช่อาศัยตำแหน่งเพียงอย่างเดียว", "คำสั่งชอบด้วยกฎหมายเสมอ หากออกโดยผู้บังคับบัญชาสูงสุด", "คำสั่งชอบด้วยกฎหมาย เพราะการปิดบริการเป็นเรื่องภายในหน่วยงาน", "คำสั่งไม่ชอบเฉพาะเมื่อประชาชนส่วนใหญ่ไม่เห็นด้วย", "คำสั่งชอบด้วยกฎหมาย หากเจ้าหน้าที่เห็นว่าเป็นวิธีที่สะดวกที่สุด", "หลักนิติรัฐกำหนดให้องค์กรของรัฐใช้อำนาจได้เมื่อมีกฎหมายให้อำนาจรองรับ ตำแหน่งหรือความสะดวกในการบริหารไม่ใช่ฐานอำนาจในตัวเอง (บทที่ 2)"],

  d.o.forEach((t,k)=>{
    const b=document.createElement("button");b.className="opt";
    b.innerHTML="<b>"+L[k]+"</b><span></span>";b.lastChild.textContent=t;
    b.onclick=()=>pick(k);box.appendChild(b);
  });
}
function pick(k){
  if(answered)return;answered=true;
  const d=qs[i],bs=$("opts").children,ok=d.o[k]===d.c;
  [...bs].forEach((b,n)=>{b.disabled=true;if(d.o[n]===d.c)b.classList.add("ok");});
  if(ok)score++;else{bs[k].classList.add("no");wrong.push(d);}
  $("sc").textContent="คะแนน "+score;
  const e=$("exp");e.className="exp "+(ok?"g":"r");
  e.textContent=(ok?"✔ ถูกต้อง! ":"✘ ไม่ถูกต้อง เฉลย: "+d.c+" — ")+d.e;
  $("next").textContent=i===qs.length-1?"ดูผลคะแนน":"ข้อถัดไป";
  $("next").className="btn";
}
$("next").onclick=()=>{ if(++i<qs.length)show(); else finish(); };
function finish(){
  $("quiz").classList.add("hide");const r=$("res");r.classList.remove("hide");
  const pct=Math.round(score/qs.length*100);
  r.innerHTML='<div class="score">'+score+' / '+qs.length+'</div><p style="text-align:center;color:var(--mu)">คิดเป็น '+pct+'%</p>';
  if(wrong.length){
    const h=document.createElement("h3");h.textContent="ข้อที่ตอบผิด ("+wrong.length+")";r.appendChild(h);
    wrong.forEach(d=>{const x=document.createElement("div");x.className="rev";
      const a=document.createElement("b");a.textContent=d.q;
      const c=document.createElement("div");c.textContent="เฉลย: "+d.c+" — "+d.e;
      x.append(a,c);r.appendChild(x);});
  }
  const b=document.createElement("button");b.className="btn";b.textContent="ทำใหม่อีกครั้ง";b.onclick=start;r.appendChild(b);
}
start();
</script>
</body>
</html>
